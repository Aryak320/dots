unbind r
bind r source-file ~/.tmux.conf
unbind C-b
set -g prefix `
set -g mouse on

bind -n C-S-Left select-pane -L
bind -n C-S-Right select-pane -R
bind -n C-S-Up select-pane -U
bind -n C-S-Down select-pane -D
unbind '"'
unbind %
bind - split-window -h
bind | split-window -v


set-option -g status-position top
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'

set -g default-terminal "tmux-256color"
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha

### https://github.com/catppuccin/tmux
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'left'
set -g status-right ""
set -ga status-right "#{?client_prefix,#[fg=#{@thm_red} bold]PRE ,#{?#{==:#{pane_mode},copy-mode},#[fg=#{@thm_yellow} bold]COP ,#[fg=#{@thm_green} bold]NOR }}"
set -g base-index 1
set -g pane-base-index 1


set -wg automatic-rename on

set -g automatic-rename-format ''

# set -g status-justify 'absolute-centre'
set -g @catppuccin_window_flags ""
set -g @catppuccin_window_current_number ""
set -g @catppuccin_window_current_text "#[fg=#{@thm_mantle},bg=#{@thm_peach}] #I#{?#{!=:#{window_name},},: #W ,}"

set -g @catppuccin_window_number ""
set -g @catppuccin_window_number_color "#{E:@thm_surface_0}"
set -g @catppuccin_window_text "#[fg=#{@thm_rosewater},bg=#{@thm_surface_1}] #I#{?#{!=:#{window_name},},  #W,}"

# set -g @catppuccin_pane_border_status "yes"
set -g @catppuccin_pane_active_border_style "##{?pane_in_mode,fg=#{@thm_peach},##{?pane_synchronized,fg=#{@thm_rosewater},fg=#{@thm_peach}}}"
set -g @catppuccin_pane_color "#{@thm_rosewater}"
set -g @plugin 'jaclu/tmux-power-zoom'
set -g @plugin 'tmux-plugins/tmux-pain-control'
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'  
